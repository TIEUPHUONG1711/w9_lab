name: Validate Kubernetes YAML

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  validate:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install kubectl
      uses: azure/setup-kubectl@v4

    - name: Validate manifests
      run: |
         kubectl apply --dry-run=client --validate=false -f k8s/