apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: kube-prometheus-stack
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 65.1.1
    helm:
      values: |
        alertmanager:
          config:
            global:
              resolve_timeout: 5m
            route:
              receiver: email
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 3h
            receivers:
            - name: email
              email_configs:
              - to: "tp17112k4@gmail.com"
                from: "tp17112k4@gmail.com"
                smarthost: "smtp.gmail.com:587"
                auth_username: "tp17112k4@gmail.com"
                auth_identity: "tp17112k4@gmail.com"
                auth_password: "abc123456@$"
                send_resolved: true
        prometheus:
          prometheusSpec:
            serviceMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            ruleSelector:
              matchLabels:
                role: prometheus-rule

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true








# #đoạn code này là để cài đặt kube-prometheus-stack bằng 
# ArgoCD, trong đó có cấu hình Alertmanager để gửi email 
# khi có cảnh báo, và cấu hình Prometheus để chọn các rule 
# có nhãn "role: prometheus-rule".    