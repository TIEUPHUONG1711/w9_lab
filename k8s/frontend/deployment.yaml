apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: demo

  annotations:
    argocd.argoproj.io/sync-wave: "2"

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
      - name: frontend
        image: nginx:1.27

        env:
        - name: API_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: API_URL